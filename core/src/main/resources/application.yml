server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  #  autoconfigure:
  #    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  config:
    import: classpath:variables.yml
  profiles:
    active: local
  data:
    mongodb:
      uri: mongodb+srv://hyejin:qkrgpwls929!@counselorcluster.hqskivq.mongodb.net/counselor?retryWrites=true&w=majority&appName=counselorCluster
      auto-index-creation: true
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      ack-mode: MANUAL_IMMEDIATE
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        linger.ms: 10
        batch.size: 16384
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: chat-consumer-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.value.default.type: com.hyejin.counselor.core.entity.Chat
        spring.json.use.type.headers: false
        max.poll.records: 1000
        session.timeout.ms: 30000
  task:
    scheduling:
      pool:
        size: 5
# Short Polling 설정
chat:
  polling:
    interval-ms: 3000  # 클라이언트 폴링 권장 간격 (3초)
    cache-size: 100    # 메모리 캐시 최대 메시지 수
    cache-expire-ms: 60000  # 캐시 만료 시간 (1분)

logging:
  pattern:
    console: "%d %-5level %logger : %msg%n"
    file: "[%d{HH:mm:ss.SSS}][%-5level][%logger.%method:line%line] - %msg%n"
  level:
    root: DEBUG
    com.zaxxer.hikari.HikariConfig: ERROR
    org.hibernate.orm.jdbc.bind: ERROR
    org.springframework.web.socket: DEBUG
    org.springframework.messaging: DEBUG
    # Kafka
    org.springframework.kafka.listener.KafkaMessageListenerContainer: WARN
    org.apache.kafka: WARN
    # MongoDB: 쿼리/커넥션 로그 숨김
    org.springframework.data.mongodb.core.MongoTemplate: WARN
    org.springframework.data.mongodb.core.MongoOperations: WARN
    org.mongodb.driver: DEBUG

