<h2 class="text-2xl font-semibold text-center mb-2">상담 신청하기</h2>
<p class="text-center text-gray-600 mb-8">전문 상담사가 친절하게 안내해드립니다</p>

<div class="max-w-xl mx-auto p-8 border rounded-lg shadow-sm bg-white">
    <h3 class="text-lg font-semibold mb-6 border-b pb-2">상담 정보 입력</h3>
    <p class="text-sm text-gray-600 mb-6">아래 정보를 입력하시면 상담사가 배정됩니다</p>

    <form id="consultation-form">
        <div class="grid grid-cols-2 gap-6 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700">이름 *</label>
                <input type="text" value="홍길동" class="mt-1 block w-full rounded-md border-gray-300 bg-gray-100 shadow-sm p-3" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">연락처 *</label>
                <input type="text" value="010-1234-5678" class="mt-1 block w-full rounded-md border-gray-300 bg-gray-100 shadow-sm p-3" required>
            </div>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700">이메일</label>
            <input type="email" value="example@email.com" class="mt-1 block w-full rounded-md border-gray-300 bg-gray-100 shadow-sm p-3">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700">상담 분야 *</label>
            <select class="mt-1 block w-full rounded-md border-gray-300 bg-gray-100 shadow-sm p-3 appearance-none" required>
                <option value="">상담 분야를 선택하세요</option>
                <option value="product">제품 문의</option>
                <option value="tech">기술 지원</option>
                <option value="payment">결제/환불</option>
                <option value="general">일반 상담</option>
                <option value="complaint">불만 접수</option>
            </select>
        </div>

        <div class="mb-8">
            <label class="block text-sm font-medium text-gray-700">상담 내용 *</label>
            <textarea rows="4" class="mt-1 block w-full rounded-md border-gray-300 bg-gray-100 shadow-sm p-3" placeholder="상담 받고 싶은 내용을 자세히 작성해주세요" required></textarea>
        </div>

        <button type="submit" class="w-full bg-primary text-white font-semibold py-3 rounded-md hover:bg-gray-800 transition duration-150">
            상담 신청하기
        </button>
    </form>
</div>
