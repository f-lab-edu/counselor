<h2 class="text-xl font-semibold mb-6">내 상담 내역</h2>

<div class="flex space-x-2 mb-6" id="list">

    <button class="tab-button px-4 py-2 text-sm rounded-md hover:bg-gray-100" data-list-filter="R">대기중</button>

    <button class="tab-button px-4 py-2 text-sm rounded-md hover:bg-gray-100" data-list-filter="E">완료</button>
</div>

        </div>
        <div class="flex items-center mb-2">

        </div>
        <div class="text-gray-600 mb-2">제품 문의</div>
        <div class="text-sm text-gray-500 flex justify-between">
            <div>확인했습니다. 잠시만 기다려주세요.</div>
            <div>2024-10-30 10:30</div>
        </div>
    </div>

    <div class="p-4 border rounded-lg shadow-sm bg-white cursor-pointer hover:bg-gray-50 consultation-item" data-status="done">

        <div class="flex items-center mb-2">
            <span class="status-tag status-done mr-2">완료</span>
            <span class="text-sm text-gray-700">상담사: 김상담</span>
        </div>
        <div class="text-gray-600 mb-2">기술 지원</div>

            <div>문제가 해결되었습니다. 감사합니다!</div>

    <div class="p-4 border rounded-lg shadow-sm bg-white cursor-pointer hover:bg-gray-50 consultation-item" data-status="waiting">
        <div class="font-bold mb-2">CS-2024-003</div>
        <div class="flex items-center mb-2">
            <span class="status-tag status-waiting mr-2">대기중</span>
            <span class="text-sm text-gray-700">상담사: 김상담</span>
        </div>
        <div class="text-gray-600 mb-2">결제/환불</div>

            <div>상담사 배정 대기중입니다.</div>
